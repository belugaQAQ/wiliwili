name: Android Build

on:
  push:
    branches: [ main, yoga ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'resources/i18n/**'
  pull_request:
    branches: [ main, yoga ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
    env:
      # SDK + NDK are fetched by buildscripts/download.sh; Gradle reuses them.
      ANDROID_HOME: ${{ github.workspace }}/scripts/android/buildscripts/sdk/android-sdk-linux
      ANDROID_NDK_HOME: ${{ github.workspace }}/scripts/android/buildscripts/sdk/android-ndk-r29
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build nasm yasm unzip wget gperf
          # recent meson (mpv/libplacebo master require >= 1.0; Ubuntu 22.04 ships 0.61)
          pip3 install meson

      - name: Build native deps (FFmpeg + libmpv)
        run: bash scripts/android/build_all.sh ${{ matrix.abi }}

      - name: Ensure Android platform 34 (compileSdk 34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" || true

      - name: Copy native libraries to jniLibs
        run: |
          case "${{ matrix.abi }}" in
            arm64-v8a)   ARCH=arm64  ;;
            armeabi-v7a) ARCH=armv7l ;;
          esac
          mkdir -p android/app/libs/${{ matrix.abi }}
          cp scripts/android/buildscripts/prefix/${ARCH}/lib/*.so android/app/libs/${{ matrix.abi }}/
          echo "=== jniLibs for ${{ matrix.abi }} ==="
          ls -la android/app/libs/${{ matrix.abi }}/

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew || true
          # Limit CMake/externalNativeBuild to this matrix ABI only (build.gradle's
          # abiFilters otherwise forces both ABIs, but each job built one libmpv).
          ./gradlew assembleDebug -Pandroid.injected.build.abi=${{ matrix.abi }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/debug/*.apk
