name: Android Build

on:
  push:
    branches: [ main, yoga ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'resources/i18n/**'
  pull_request:
    branches: [ main, yoga ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
    env:
      # SDK + NDK are fetched by buildscripts/download.sh; Gradle reuses them.
      # Clear the runner's preset ANDROID_SDK_ROOT so AGP only sees ANDROID_HOME
      # (AGP 8.7 fails if both point to different paths).
      ANDROID_HOME: ${{ github.workspace }}/scripts/android/buildscripts/sdk/android-sdk-linux
      ANDROID_SDK_ROOT: ${{ github.workspace }}/scripts/android/buildscripts/sdk/android-sdk-linux
      ANDROID_NDK_HOME: ${{ github.workspace }}/scripts/android/buildscripts/sdk/android-ndk-r29
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build nasm yasm unzip wget gperf
          # recent meson (mpv/libplacebo master require >= 1.0; Ubuntu 22.04 ships 0.61)
          pip3 install meson

      - name: Build native deps (FFmpeg + libmpv)
        run: bash scripts/android/build_all.sh ${{ matrix.abi }}

      - name: Build libromfs-generator (host tool for borealis)
        run: |
          cd library/borealis
          bash build_libromfs_generator.sh

      - name: Copy native libraries to jniLibs
        run: |
          case "${{ matrix.abi }}" in
            arm64-v8a)   ARCH=arm64  ;;
            armeabi-v7a) ARCH=armv7l ;;
          esac
          mkdir -p android/app/libs/${{ matrix.abi }}
          cp scripts/android/buildscripts/prefix/${ARCH}/lib/*.so android/app/libs/${{ matrix.abi }}/
          echo "=== jniLibs for ${{ matrix.abi }} ==="
          ls -la android/app/libs/${{ matrix.abi }}/

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew || true
          # Use a custom wiliwili.abi property (consumed by app/build.gradle)
          # instead of android.injected.build.abi — the latter is an IDE-deploy
          # injected property that can cause AGP to skip writing the final APK
          # to outputs/apk/. With abiFilters set to a single ABI via our own
          # property, CMake builds one ABI and the APK lands in the normal
          # outputs/apk/debug/ directory.
          ./gradlew assembleDebug -Pwiliwili.abi=${{ matrix.abi }}

      - name: Locate built APK
        # Diagnostics: list every .apk anywhere under app/build/ so we can see
        # the real output location (outputs/ vs intermediates/) in the log.
        run: |
          echo "=== APK files under android/app/build ==="
          find android/app/build -name '*.apk' -printf '%p (%s bytes)\n' 2>/dev/null || true
          echo "=== contents of android/app/build/outputs ==="
          ls -R android/app/build/outputs 2>/dev/null || echo "(no outputs dir)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/**/*.apk
