plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.xfangfang.wiliwili'
    compileSdk 34
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "cn.xfangfang.wiliwili"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.6.0"

        ndk {
            // CI passes -Pwiliwili.abi=<abi> to build one ABI per matrix job.
            // Without it (local builds) both ABIs are built and packaged.
            def wiliAbi = project.findProperty("wiliwili.abi")
            if (wiliAbi != null) {
                abiFilters wiliAbi
            } else {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        externalNativeBuild {
            cmake {
                arguments "-DPLATFORM_ANDROID=ON",
                          "-DANDROID_STL=c++_shared",
                          "-DUSE_SYSTEM_CURL=OFF",
                          "-DUSE_SYSTEM_CPR=OFF",
                          "-DWILIWILI_PREFIX=${rootProject.projectDir}/../scripts/android/buildscripts/prefix",
                          "-DLIBROMFS_PREBUILT_GENERATOR=${rootProject.projectDir}/../library/borealis/libromfs-generator",
                          "-DDISABLE_WEBP=ON"
                targets "wiliwili"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1+"
        }
    }

    sourceSets {
        main {
            // Resources (font, xml, i18n, svg, ...) are embedded into
            // libwiliwili.so by libromfs at compile time (toolchain.cmake
            // auto-enables USE_LIBROMFS on Android), so they are NOT read
            // from APK assets at runtime. Listing resources/ as an assets
            // source dir only duplicates them into the APK and causes
            // "Failed to load asset path /proc/<pid>/fd/<n>" because AGP
            // compresses those entries and SDL2's Java AssetManager.openFd
            // can't mmap compressed assets.
            jniLibs.srcDirs = ['libs']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
